name: Release image
run-name: Release image from ${{ github.ref_name }} at ${{ github.sha }}

on:
  workflow_dispatch:

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release version
        id: release
        run: |
          release_date=$(date -u +%Y.%m.%d)
          last_sequence=$(
            git tag --list "v${release_date}.*" |
              sed -n "s/^v${release_date}\.\([1-9][0-9]*\)$/\1/p" |
              sort -n |
              tail -1
          )
          sequence=$(( ${last_sequence:-0} + 1 ))
          version="v${release_date}.${sequence}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          existing_version=$(
            git tag --points-at "$GITHUB_SHA" |
              sed -nE '/^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$/p' |
              head -1
          )
          if [[ -n "$existing_version" ]]; then
            echo "::error::Commit $GITHUB_SHA is already released as $existing_version."
            exit 1
          fi

          {
            echo "version=$version"
            echo "git_tag=$version"
            echo "source=$image:sha-$GITHUB_SHA"
            echo "target=$image:$version"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify release candidate
        run: docker buildx imagetools inspect "${{ steps.release.outputs.source }}"

      - name: Add version tag to image
        run: >-
          docker buildx imagetools create
          --tag "${{ steps.release.outputs.target }}"
          "${{ steps.release.outputs.source }}"

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ steps.release.outputs.git_tag }}"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "${{ steps.release.outputs.version }}"
          --generate-notes
